<title>ZOB Airspace Trainer</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen scope app — header, layer strip, radar-scope map, study panel below. Single dark look by design (ERAM scope). */
:root {
  --scope: #0a0e13;
  --panel: #111821;
  --raise: #18212c;
  --line: #263241;
  --fg: #d7dee7;
  --muted: #8592a3;
  --low: #4cc38a;
  --high: #5aa9ff;
  --app: #ffb547;
  --mark: #ff5c7a;
  --good: #7ee0a8;
  --bad: #ff7a7a;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--scope); color: var(--fg); font-family: var(--f-body); font-size: 14px;
  overflow: hidden;
}
.app { height: 100%; display: flex; flex-direction: column; }
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px 8px; background: var(--panel); border-bottom: 1px solid var(--line);
}
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .04em;
  text-transform: uppercase; line-height: 1;
}
h1 small { display: block; font-family: var(--f-mono); font-weight: 400; font-size: 10px; letter-spacing: .08em; color: var(--muted); margin-top: 3px; text-transform: none; }
.modes { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
.modes button {
  font: 600 13px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase;
  padding: 9px 12px; background: transparent; color: var(--muted); border: 0; cursor: pointer;
}
.modes button[aria-pressed="true"] { background: var(--fg); color: var(--scope); }
.strip {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.chip {
  font: 500 12px/1 var(--f-mono); padding: 7px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
}
.chip .sw { width: 14px; height: 0; border-top: 2px solid currentColor; }
.chip[data-layer="high"] .sw { border-top-style: dashed; }
.chip[aria-pressed="true"] { color: var(--fg); background: var(--raise); border-color: #3a4a5e; }
.chip[data-layer="low"][aria-pressed="true"] .sw { color: var(--low); }
.chip[data-layer="high"][aria-pressed="true"] .sw { color: var(--high); }
.chip[data-layer="approach"][aria-pressed="true"] .sw { color: var(--app); }
select, .btn {
  font: 500 13px/1.2 var(--f-mono); color: var(--fg); background: var(--raise);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 8px;
}
.strip select { padding: 6px 8px; font-size: 12px; max-width: 100%; }
.btn { cursor: pointer; padding: 9px 12px; }
.btn.primary { background: var(--fg); color: var(--scope); border-color: var(--fg); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--high); outline-offset: 2px; }
.mapwrap { position: relative; flex: 1 1 auto; min-height: 180px; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mapbtns { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.mapbtns button {
  width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--line);
  background: rgba(17,24,33,.85); color: var(--fg); font: 600 16px/1 var(--f-mono); cursor: pointer;
}
.mapbtns button.v3 { font: 700 13px/1 var(--f-display); letter-spacing: .06em; margin-top: 6px; }
.mapbtns button.v3[aria-pressed="true"] { background: var(--fg); color: var(--scope); border-color: var(--fg); }
.own.on { border-color: var(--fg); background: #1e2a38; }
.readout {
  position: absolute; left: 10px; bottom: 8px; font: 400 10px/1.3 var(--f-mono); color: var(--muted);
  pointer-events: none; font-variant-numeric: tabular-nums;
}
.panel {
  flex: 0 0 auto; max-height: 46%; overflow-y: auto; background: var(--panel);
  border-top: 1px solid var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
}
.eyebrow { font: 600 11px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.hint { color: var(--muted); margin: 0; line-height: 1.45; }
.coord { font-family: var(--f-mono); font-size: 12px; color: var(--fg); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.own {
  display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px;
  padding: 9px 10px; background: var(--raise); border: 1px solid var(--line); border-radius: 6px;
  width: 100%; text-align: left; color: var(--fg); cursor: pointer; font: inherit;
}
.own .dot { width: 10px; height: 10px; border-radius: 2px; }
.own .nm { font-weight: 600; min-width: 0; }
.own .ly { display: block; font: 400 11px/1.2 var(--f-mono); color: var(--muted); margin-top: 2px; }
.own .bd { font: 600 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 6px; align-items: center; }
.row select { width: 100%; min-width: 0; padding: 8px 4px; font-size: 12px; }
.row .x { width: 34px; height: 34px; padding: 0; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font: 600 15px/1 var(--f-mono); }
.row.ok select { border-color: var(--good); }
.row.no select { border-color: var(--bad); }
.slider { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 10px; margin-bottom: 12px; }
.slider label { font: 600 12px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--fg); }
.slider input { width: 100%; accent-color: var(--high); }
.slider span { grid-column: 1 / -1; font: 400 11px/1.3 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.labels { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 6px; font: 500 10px/1 var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.score { margin-left: auto; font: 500 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.verdict { margin: 10px 0 6px; font: 700 18px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.tag { font: 600 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 4px; }
.tag.good { color: var(--good); border: 1px solid var(--good); }
.tag.bad { color: var(--bad); border: 1px solid var(--bad); }
.src { margin-top: 12px; font: 400 10px/1.4 var(--f-mono); color: var(--muted); }
.src a { color: var(--muted); }
@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto auto 1fr; }
  header, .strip { grid-column: 1 / -1; }
  .mapwrap { grid-column: 1; grid-row: 3; }
  .panel { grid-column: 2; grid-row: 3; max-height: none; border-top: 0; border-left: 1px solid var(--line); }
}
</style>
</head>

<script>
(() => {
  const D = JSON.parse(document.getElementById('zob-data').textContent);
  const COLORS = { low: '#4cc38a', high: '#5aa9ff', approach: '#ffb547', outline: '#a3adbb' };
  const LAYER_NAME = { low: 'Low', high: 'High', approach: 'Approach', outline: 'Center (no sector data)' };
  const FAC_NAME = { ZOB: 'Cleveland', ZNY: 'New York', ZAU: 'Chicago', CZYZ: 'Toronto', ZDC: 'Washington', ZID: 'Indianapolis', ZBW: 'Boston' };

  // ---------- data ----------
  const sectors = D.sectors.map(s => ({
    id: s.id, name: s.name, short: s.short, approach: s.type === 'approach', outline: s.type === 'outline',
    fac: s.facility, home: s.facility === 'ZOB', tier: s.tier,
    display: s.type === 'approach' ? `${s.name} (${s.short})` : s.name,
    volumes: [],
  }));
  const byId = Object.fromEntries(sectors.map(s => [s.id, s]));
  const volumes = [];
  D.sectors.forEach((s, i) => s.volumes.forEach(v => {
    const lats = v.points.map(p => p[0]), lons = v.points.map(p => p[1]);
    let a = 0;
    for (let k = 0, j = lats.length - 1; k < lats.length; j = k++) a += lons[j] * lats[k] - lons[k] * lats[j];
    const vol = {
      sid: s.id, home: s.facility === 'ZOB', layer: v.layer, floor: v.floor, ceil: v.ceiling, prio: v.priority || 0, note: v.note, lats, lons,
      minLat: Math.min(...lats), maxLat: Math.max(...lats), minLon: Math.min(...lons), maxLon: Math.max(...lons),
      area: Math.abs(a) / 2, label: v.label || [lats[0], lons[0]],
    };
    volumes.push(vol); sectors[i].volumes.push(vol);
  }));
  const homeVols = volumes.filter(v => v.home);
  const B = {
    minLat: Math.min(...homeVols.map(v => v.minLat)), maxLat: Math.max(...homeVols.map(v => v.maxLat)),
    minLon: Math.min(...homeVols.map(v => v.minLon)), maxLon: Math.max(...homeVols.map(v => v.maxLon)),
  };
  const lat0 = (B.minLat + B.maxLat) / 2, lon0 = (B.minLon + B.maxLon) / 2;
  const cos0 = Math.cos(lat0 * Math.PI / 180);
  const px = lon => (lon - lon0) * cos0, py = lat => lat0 - lat;
  // one label per sector per layer, on its largest piece
  const labelVols = Object.values(volumes.reduce((m, v) => {
    const k = v.sid + '|' + v.layer; if (!m[k] || m[k].area < v.area) m[k] = v; return m;
  }, {}));

  function inside(v, lat, lon) {
    if (lat < v.minLat || lat > v.maxLat || lon < v.minLon || lon > v.maxLon) return false;
    let c = false;
    for (let i = 0, j = v.lats.length - 1; i < v.lats.length; j = i++) {
      const yi = v.lats[i], yj = v.lats[j];
      if ((yi > lat) !== (yj > lat) && lon < v.lons[i] + (lat - yi) * (v.lons[j] - v.lons[i]) / (yj - yi)) c = !c;
    }
    return c;
  }
  // Altitudes are in hundreds of feet. Bands are inclusive ("SFC-080", "090-FL230"), so the
  // next usable altitude above a band is +10 and bands up to 10 apart are one block.
  function merge(bands) {
    const out = [];
    bands.slice().sort((a, b) => a[0] - b[0]).forEach(b => {
      const l = out[out.length - 1];
      if (l && b[0] <= l[1] + 10) l[1] = Math.max(l[1], b[1]); else out.push([b[0], b[1]]);
    });
    return out;
  }
  function subtract(own, cut) {
    let pieces = own;
    cut.forEach(([cl, ch]) => {
      const next = [];
      pieces.forEach(([lo, hi]) => {
        if (ch < lo || cl > hi) next.push([lo, hi]);
        else {
          if (cl > lo) next.push([lo, cl - 10]);
          if (ch < hi) next.push([Math.min(ch + 10, hi), hi]);
        }
      });
      pieces = next.filter(([lo, hi]) => hi >= lo);
    });
    return pieces;
  }
  // Who owns the airspace over a point, bottom to top.
  // 1. Approach controls own their delegated volumes; where two stack, the thinner one owns its slice.
  // 2. Center shelves (BKI 240-270 over YNG, delegated pieces) carve out of the base sectors.
  // 3. Base sectors own what's left. If two facilities' data claim the same airspace, both are listed and flagged.
  // 4. Centers with no sector data (ZDC, ZID, ZBW) only answer where nothing else does.
  function lookup(lat, lon, withNeighbors) {
    const hits = volumes.filter(v => (withNeighbors || v.home) && inside(v, lat, lon));
    const groups = {};
    hits.forEach(v => {
      const k = v.sid + '|' + v.layer + '|' + v.prio;
      const g = groups[k] = groups[k] || { sid: v.sid, layer: v.layer, prio: v.prio, note: v.note, bands: [] };
      g.bands.push([v.floor, v.ceil]);
    });
    const gs = Object.values(groups).map(g => ({ ...g, bands: merge(g.bands) }));
    const span = g => g.bands.reduce((a, b) => a + b[1] - b[0], 0);
    let taken = [];
    const out = [];
    gs.filter(g => g.layer === 'approach').sort((a, b) => span(a) - span(b)).forEach(g => {
      const bands = subtract(g.bands, taken);
      taken = merge(taken.concat(bands));
      bands.forEach(([lo, hi]) => out.push({ sid: g.sid, layer: g.layer, lo, hi, note: g.note }));
    });
    const tier = list => {
      const add = [];
      list.forEach(g => subtract(g.bands, taken).forEach(([lo, hi]) => add.push({ sid: g.sid, layer: g.layer, lo, hi })));
      add.forEach(a => add.forEach(b => {
        if (a.sid !== b.sid && a.lo <= b.hi && b.lo <= a.hi && byId[a.sid].fac !== byId[b.sid].fac) a.overlap = b.sid;
      }));
      taken = merge(taken.concat(add.map(a => [a.lo, a.hi])));
      return add;

        <select data-f="sid" id="ch-sid-${i}" aria-label="Sector ${i + 1}"${c.checked ? ' disabled' : ''}><option value="">Sector…</option>${sectorOpts(r.sid)}</select>
        <select data-f="lo" id="ch-lo-${i}" aria-label="Floor ${i + 1}"${c.checked ? ' disabled' : ''}>${altOpts(r.lo)}</select>
        <select data-f="hi" id="ch-hi-${i}" aria-label="Ceiling ${i + 1}"${c.checked ? ' disabled' : ''}>${altOpts(r.hi)}</select>
        <button class="x" data-rm="${i}" aria-label="Remove row"${c.checked || c.rows.length === 1 ? ' disabled' : ''}>×</button>
      </div>`;
    }).join('');
    let result = '';
    if (c.checked) {
      const got = new Set(c.rows.filter(r => r.sid).map(r => key({ sid: r.sid, lo: +r.lo, hi: +r.hi })));
      result = `<p class="verdict ${c.right ? 'good' : 'bad'}">${c.right ? 'Correct' : 'Not quite'}</p>
        <ul class="stack">${c.answer.map(a => ownRow(a, got.has(key(a)) ? ' · <span class="tag good">got it</span>' : ' · <span class="tag bad">missed</span>')).join('')}</ul>`;
    }
    panel.innerHTML = `<p class="eyebrow">Challenge · <span class="coord">${fmtLat(c.lat)} ${fmtLon(c.lon)}</span></p>
      <p class="hint" style="margin-bottom:10px">Name every ${[...st.layers].map(l => LAYER_NAME[l].toLowerCase()).join(' / ')} owner over the marker${st.focus ? ` (inside ${esc(byId[st.focus].display)})` : ''}, each with its floor and ceiling. A sector cut by an approach shelf gets one row per band.</p>
      <div class="slider">
        <label for="ch-radius">Choices</label>
        <input type="range" id="ch-radius" min="0" max="${RADII.length - 1}" step="1" value="${st.radiusIdx}" aria-describedby="ch-radius-val">
        <span id="ch-radius-val">${R === Infinity ? 'everything' : 'within ' + R + ' nm'} · ${nZob} sectors · ${altList.length} altitudes</span>
      </div>
      <div class="labels"><span>Sector</span><span>Floor</span><span>Ceiling</span><span></span></div>
      <div class="stack">${rowsHtml}</div>
      <div class="actions">
        ${c.checked ? `<button class="btn primary" id="ch-next">Next point</button>`
          : `<button class="btn" id="ch-add">+ Add owner</button><button class="btn primary" id="ch-check">Check</button><button class="btn" id="ch-skip">Skip</button>`}
        ${sc}
      </div>${result}`;
    panel.querySelectorAll('.row select').forEach(s => s.onchange = () => {
      const i = +s.closest('.row').dataset.i; c.rows[i][s.dataset.f] = s.value;
    });
    panel.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { c.rows.splice(+b.dataset.rm, 1); renderPanel(); });
    const rad = document.getElementById('ch-radius');
    if (rad) rad.oninput = () => {
      st.radiusIdx = +rad.value;
      try { localStorage.setItem('zob-radius', String(st.radiusIdx)); } catch (e) {}
      renderPanel();
      const again = document.getElementById('ch-radius'); if (again) again.focus();
    };
    panel.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => {});
    const q = id => document.getElementById(id);
    if (q('ch-add')) q('ch-add').onclick = () => { c.rows.push({ sid: '', lo: '', hi: '' }); renderPanel(); };
    if (q('ch-check')) q('ch-check').onclick = check;
    if (q('ch-skip')) q('ch-skip').onclick = newChallenge;
    if (q('ch-next')) q('ch-next').onclick = newChallenge;
  }
  renderPanel();
  // expose for a quick self-test
  window.__zob = { lookup, sectors };
})();
</script>

</body>
</html>
