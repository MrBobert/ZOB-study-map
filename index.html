<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ZOB Airspace Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen scope app — header, layer strip, radar-scope map, study panel below. Single dark look by design (ERAM scope). */
:root {
  --scope: #0a0e13;
  --panel: #111821;
  --raise: #18212c;
  --line: #263241;
  --fg: #d7dee7;
  --muted: #8592a3;
  --low: #4cc38a;
  --high: #5aa9ff;
  --app: #ffb547;
  --mark: #ff5c7a;
  --good: #7ee0a8;
  --warn: #ffc857;
  --bad: #ff7a7a;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--scope); color: var(--fg); font-family: var(--f-body); font-size: 14px;
  overflow: hidden;
}
.app { height: 100%; display: flex; flex-direction: column; }
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px 8px; background: var(--panel); border-bottom: 1px solid var(--line);
}
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .04em;
  text-transform: uppercase; line-height: 1;
}
h1 small { display: block; font-family: var(--f-mono); font-weight: 400; font-size: 10px; letter-spacing: .08em; color: var(--muted); margin-top: 3px; text-transform: none; }
.modes { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
.modes button {
  font: 600 13px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase;
  padding: 9px 12px; background: transparent; color: var(--muted); border: 0; cursor: pointer;
}
.modes button[aria-pressed="true"] { background: var(--fg); color: var(--scope); }
.strip {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.chip {
  font: 500 12px/1 var(--f-mono); padding: 7px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
}
.chip .sw { width: 14px; height: 0; border-top: 2px solid currentColor; }
.chip[data-layer="high"] .sw { border-top-style: dashed; }
.chip[aria-pressed="true"] { color: var(--fg); background: var(--raise); border-color: #3a4a5e; }
.chip[data-layer="low"][aria-pressed="true"] .sw { color: var(--low); }
.chip[data-layer="high"][aria-pressed="true"] .sw { color: var(--high); }
.chip[data-layer="approach"][aria-pressed="true"] .sw { color: var(--app); }
select, .btn {
  font: 500 13px/1.2 var(--f-mono); color: var(--fg); background: var(--raise);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 8px;
}
.strip select { padding: 6px 8px; font-size: 12px; max-width: 100%; }
.btn { cursor: pointer; padding: 9px 12px; }
.btn.primary { background: var(--fg); color: var(--scope); border-color: var(--fg); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--high); outline-offset: 2px; }
.mapwrap { position: relative; flex: 1 1 auto; min-height: 180px; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mapbtns { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.mapbtns button {
  width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--line);
  background: rgba(17,24,33,.85); color: var(--fg); font: 600 16px/1 var(--f-mono); cursor: pointer;
}
.mapbtns button.v3 { font: 700 13px/1 var(--f-display); letter-spacing: .06em; margin-top: 6px; }
.mapbtns button.v3[aria-pressed="true"] { background: var(--fg); color: var(--scope); border-color: var(--fg); }
.own.on { border-color: var(--fg); background: #1e2a38; }
.readout {
  position: absolute; left: 10px; bottom: 8px; font: 400 10px/1.3 var(--f-mono); color: var(--muted);
  pointer-events: none; font-variant-numeric: tabular-nums;
}
.panel {
  flex: 0 0 auto; max-height: 46%; overflow-y: auto; background: var(--panel);
  border-top: 1px solid var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
}
.eyebrow { font: 600 11px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.hint { color: var(--muted); margin: 0; line-height: 1.45; }
.coord { font-family: var(--f-mono); font-size: 12px; color: var(--fg); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.own {
  display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px;
  padding: 9px 10px; background: var(--raise); border: 1px solid var(--line); border-radius: 6px;
  width: 100%; text-align: left; color: var(--fg); cursor: pointer; font: inherit;
}
.own .dot { width: 10px; height: 10px; border-radius: 2px; }
.own .nm { font-weight: 600; min-width: 0; }
.own .ly { display: block; font: 400 11px/1.2 var(--f-mono); color: var(--muted); margin-top: 2px; }
.own .bd { font: 600 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 6px; align-items: center; }
.row select { width: 100%; min-width: 0; padding: 8px 4px; font-size: 12px; }
.row .x { width: 34px; height: 34px; padding: 0; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font: 600 15px/1 var(--f-mono); }
.row select.ok { border-color: var(--good); color: var(--good); }
.row select.amb { border-color: var(--warn); color: var(--warn); }
.row select.no { border-color: var(--bad); color: var(--bad); }
.row select:disabled { opacity: 1; }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
.seg span { font: 600 12px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; margin-right: 4px; }
.seg button { font: 500 12px/1 var(--f-mono); padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--fg); background: var(--raise); border-color: #3a4a5e; }
.slider { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 10px; margin-bottom: 12px; }
.slider label { font: 600 12px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--fg); }
.slider input { width: 100%; accent-color: var(--high); }
.slider span { grid-column: 1 / -1; font: 400 11px/1.3 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row.split, .labels.split { grid-template-columns: minmax(0, 1.5fr) minmax(0, .7fr) minmax(0, 1fr) minmax(0, 1fr) 34px; }
.labels { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 6px; font: 500 10px/1 var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.score { margin-left: auto; font: 500 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.verdict { margin: 10px 0 6px; font: 700 18px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.tag { font: 600 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 4px; }
.tag.good { color: var(--good); border: 1px solid var(--good); }
.tag.bad { color: var(--bad); border: 1px solid var(--bad); }
.src { margin-top: 12px; font: 400 10px/1.4 var(--f-mono); color: var(--muted); }
.src a { color: var(--muted); }
@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto auto 1fr; }
  header, .strip { grid-column: 1 / -1; }
  .mapwrap { grid-column: 1; grid-row: 3; }
  .panel { grid-column: 2; grid-row: 3; max-height: none; border-top: 0; border-left: 1px solid var(--line); }
}
</style>
</head>

<script>
(() => {
  const D = JSON.parse(document.getElementById('zob-data').textContent);
  const GEO = JSON.parse(document.getElementById('zob-geo').textContent); // Natural Earth lakes, state/province and US–Canada lines
  // ETOPO5 elevations (5-minute grid, tens of feet; negative = Great Lakes water at that surface level)
  const TER = JSON.parse(document.getElementById('zob-terrain').textContent);
  TER.z = (() => {
    const bin = atob(TER.data), buf = new ArrayBuffer(bin.length), u8 = new Uint8Array(buf);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new Int16Array(buf);
  })();
  const terCell = (i, j) => TER.z[i * TER.cols + j];
  function elevFt(lat, lon) { // bilinear, feet MSL
    const fi = (lat - TER.lat0) / TER.dlat, fj = (lon - TER.lon0) / TER.dlon;
    const i = Math.max(0, Math.min(TER.rows - 2, Math.floor(fi))), j = Math.max(0, Math.min(TER.cols - 2, Math.floor(fj)));
    const a = fi - i, b = fj - j, h = (ii, jj) => Math.abs(terCell(ii, jj)) * TER.unit;
    return (h(i, j) * (1 - b) + h(i, j + 1) * b) * (1 - a) + (h(i + 1, j) * (1 - b) + h(i + 1, j + 1) * b) * a;
  }
  const COLORS = { low: '#4cc38a', high: '#5aa9ff', approach: '#ffb547', outline: '#a3adbb' };
  const LAYER_NAME = { low: 'Low', high: 'High', approach: 'Approach', outline: 'Center (no sector data)' };
  const FAC_NAME = { ZOB: 'Cleveland', ZNY: 'New York', ZAU: 'Chicago', CZYZ: 'Toronto', ZDC: 'Washington', ZID: 'Indianapolis', ZBW: 'Boston' };

  // ---------- data ----------
  const sectors = D.sectors.map(s => ({

    display: s.type === 'approach' ? `${s.name} (${s.short})` : s.name,
    volumes: [],
  }));
  const byId = Object.fromEntries(sectors.map(s => [s.id, s]));
  const volumes = [];
  D.sectors.forEach((s, i) => s.volumes.forEach(v => {
    const lats = v.points.map(p => p[0]), lons = v.points.map(p => p[1]);

  document.getElementById('z-fit').onclick = () => {
    if (st.view3d) { V3.az = -Math.PI / 2 - 0.35; V3.el = 0.5; fit3d(); draw(); }
    else fit(st.focus ? sectorBounds(byId[st.focus]) : B);
  };
  const b3d = document.getElementById('v-3d'), tAdj = document.getElementById('t-adj'), tTer = document.getElementById('t-ter');
  tTer.onclick = () => { st.terrain = !st.terrain; tTer.setAttribute('aria-pressed', st.terrain); draw(); };
  function set3d(on) {
    st.view3d = on;
    b3d.textContent = on ? '2D' : '3D';
    b3d.setAttribute('aria-pressed', on);
    b3d.setAttribute('aria-label', on ? 'Back to the map' : 'Show in 3D');
    tAdj.hidden = !on; tTer.hidden = !on;
    if (on) {
      if (!st.focus && st.results && st.results.length) {
        const pickR = st.results.find(r => r.layer === 'low' && byId[r.sid].home) || st.results.find(r => r.layer !== 'outline');
        if (pickR) { st.focus = pickR.sid; focusSel.value = st.focus; }
      }
      V3.sel = null; V3.hits = [];
      refresh3d(true);
      panel3d();
    } else {
      if (st.focus) fit(sectorBounds(byId[st.focus]));
      renderPanel(); draw();
    }
  }
  b3d.onclick = () => set3d(!st.view3d);
  tAdj.onclick = () => { st.adj = !st.adj; tAdj.setAttribute('aria-pressed', st.adj); refresh3d(true); panel3d(); };

  // ---------- controls ----------
  const focusSel = document.getElementById('focus');
  function fillFocus() {
    const cur = st.focus;
    const opt = (s) => `<option value="${s.id}">${s.display}</option>`;
    const grp = (label, list) => list.length ? `<optgroup label="${label}">${list.map(opt).join('')}</optgroup>` : '';
    const zob = sectors.filter(s => s.home);
    const nb = sectors.filter(s => !s.home);
    focusSel.innerHTML = `<option value="">All sectors</option>`
      + grp('ZOB areas', areas)
      + grp('ZOB center', zob.filter(s => !s.approach))
      + grp('ZOB approach', zob.filter(s => s.approach).sort((a, b) => a.name.localeCompare(b.name)))
      + ['ZNY', 'ZAU', 'CZYZ'].map(f => grp(`${FAC_NAME[f]} (${f})`, nb.filter(s => s.fac === f))).join('')
      + grp('Outline only', nb.filter(s => s.outline));
    focusSel.value = cur;
  }
  fillFocus();
  focusSel.onchange = () => {
    st.focus = focusSel.value;
    if (st.view3d) { V3.sel = null; refresh3d(true); panel3d(); return; }
    fit(st.focus ? sectorBounds(byId[st.focus]) : B);
    if (st.mode === 'challenge') newChallenge();
  };
  document.querySelectorAll('.chip[data-layer]').forEach(b => b.onclick = () => {
    const l = b.dataset.layer;
    if (st.layers.has(l)) { if (st.layers.size === 1) return; st.layers.delete(l); } else st.layers.add(l);
    b.setAttribute('aria-pressed', st.layers.has(l));
    if (st.mode === 'explore' && st.marker) st.results = query(...st.marker);
    if (st.view3d) { refresh3d(false); panel3d(); return; }
    if (st.mode === 'challenge') newChallenge(); else renderPanel();
    draw();
  });
  const tLabels = document.getElementById('t-labels'), tApts = document.getElementById('t-apts');
  const setLabels = v => { st.labels = v; tLabels.setAttribute('aria-pressed', v); draw(); };
  tLabels.onclick = () => setLabels(!st.labels);
  const tNb = document.getElementById('t-nb');
  tNb.onclick = () => {
    st.nb = !st.nb; tNb.setAttribute('aria-pressed', st.nb);
    if (!st.nb && st.focus && !byId[st.focus].home) { st.focus = ''; focusSel.value = ''; }
    if (st.mode === 'explore' && st.marker) st.results = query(...st.marker);
    if (st.view3d) { refresh3d(false); panel3d(); return; }
    if (st.mode === 'challenge') newChallenge(); else renderPanel();
    draw();
  };
  tApts.onclick = () => { st.apts = !st.apts; tApts.setAttribute('aria-pressed', st.apts); draw(); };
  const tGeo = document.getElementById('t-geo');
  tGeo.setAttribute('aria-pressed', st.geo);
  tGeo.onclick = () => {
    st.geo = !st.geo; tGeo.setAttribute('aria-pressed', st.geo);
    try { localStorage.setItem('zob-geo', st.geo ? '1' : ''); } catch (e) {}
    draw();
  };
  const mE = document.getElementById('m-explore'), mC = document.getElementById('m-challenge');
  function setMode(m) {
    if (st.view3d && m === 'challenge') set3d(false);
    b3d.hidden = m === 'challenge';
    st.mode = m;
    mE.setAttribute('aria-pressed', m === 'explore'); mC.setAttribute('aria-pressed', m === 'challenge');
    if (m === 'challenge') { setLabels(false); newChallenge(); } else { setLabels(true); renderPanel(); draw(); }
  }
  mE.onclick = () => setMode('explore');
  mC.onclick = () => setMode('challenge');

  // ---------- challenge ----------
  function newChallenge() {
    // With neighbors on, points can land up to ~40 nm outside ZOB so the seams get tested too.
    // With a focus, points land inside it, or (about 4 in 10) in the ring just outside it.
    const F = st.focus && byId[st.focus];
    const ring = F ? RINGS[st.ringIdx] : 0;
    const fv = F ? F.volumes.filter(v => v.layer !== 'outline') : [];
    const pad = F ? ring / 60 : (st.nb ? 0.7 : 0);
    const b0 = F ? sectorBounds(F) : B;
    const b = { minLat: b0.minLat - pad, maxLat: b0.maxLat + pad, minLon: b0.minLon - pad / cos0, maxLon: b0.maxLon + pad / cos0 };
    const outside = ring > 0 && Math.random() < 0.4;
    let pick = null;
    for (let i = 0; i < 8000 && !pick; i++) {
      const lat = b.minLat + Math.random() * (b.maxLat - b.minLat);
      const lon = b.minLon + Math.random() * (b.maxLon - b.minLon);
      if (F) {
        const inF = fv.some(v => inside(v, lat, lon));
        if (outside ? inF : !inF) continue;
        if (outside && Math.min(...fv.map(v => distNm(v, lat, lon))) > ring) continue;
      }
      const ans = query(lat, lon);
      if (!ans.length || ans.some(r => r.layer === 'outline')) continue;
      if (!F && !lookup(lat, lon, false).length && !nearHome(lat, lon)) continue;
      if (F && !outside && !ans.some(r => inFocus(r.sid))) continue;
      pick = { lat, lon, answer: ans, outside };
    }
    st.ch = pick ? { ...pick, rows: [{ sid: '', lo: '', hi: '' }], checked: false } : null;
    if (pick) ensureVisible(pick.lat, pick.lon);
    renderPanel(); draw();
  }
  // true if some ZOB volume edge is within ~0.7° of the point (keeps neighbour points near the seam)
  function nearHome(lat, lon) {
    for (const d of [[0.35, 0], [-0.35, 0], [0, 0.45], [0, -0.45], [0.7, 0], [-0.7, 0], [0, 0.9], [0, -0.9]])
      if (lookup(lat + d[0], lon + d[1], false).length) return true;
    return false;
  }
  const key = r => `${r.sid}|${r.lo}|${r.hi}`;
  // a sector's number ("48" for RAV 48), or '' for approaches and sectors without one
  const numOf = sid => { const s = byId[sid]; if (!s || s.approach || s.outline) return ''; const m = sid.match(/:(\d{1,3})$/); return m ? m[1].padStart(2, '0') : ''; };
  // with numbers split off, a row is only right if its number is right too
  const rowKey = r => key({ sid: r.sid, lo: +r.lo, hi: +r.hi }) + (st.split && (r.num || '') !== numOf(r.sid) ? '|wrong-number' : '');
  const RADII = [10, 25, 50, 100, 200, Infinity];
  const RINGS = [0, 10, 25];
  // distance in nm from a point to a volume (0 inside), on a local flat projection
  function distNm(v, lat, lon) {
    if (inside(v, lat, lon)) return 0;
    const k = Math.cos(lat * Math.PI / 180) * 60;
    let best = Infinity;
    for (let i = 0, j = v.lats.length - 1; i < v.lats.length; j = i++) {
      const ax = (v.lons[j] - lon) * k, ay = (v.lats[j] - lat) * 60, bx = (v.lons[i] - lon) * k, by = (v.lats[i] - lat) * 60;
      const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
      const t = L ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L)) : 0;
      best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
    }
    return best;
  }
  function check() {
    const c = st.ch;
    const rows = c.rows.filter(r => r.sid && r.lo !== '' && r.hi !== '');
    const want = new Set(c.answer.map(key));
    const got = new Set(rows.map(rowKey));
    c.right = want.size === got.size && [...want].every(k => got.has(k));
    c.checked = true;
    st.score.total++; if (c.right) st.score.right++;
    saveScore();
    renderPanel(); draw();
  }

  // ---------- panel ----------
  const panel = document.getElementById('panel');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const srcLine = `<p class="src">ZOB sectors, strata and TRACONs traced from the ZOB study maps dated July 9, 2026. Neighboring ZNY, ZAU and Toronto sectors are VATSIM data and only approximate. Study use only.</p>`;
  function ownRow(r, extra = '') {
    const s = byId[r.sid];
    return `<li><button class="own" data-focus="${r.sid}">
      <span class="dot" style="background:${COLORS[r.layer]}"></span>
      <span class="nm">${esc(s.display)}<span class="ly">${s.home ? '' : esc(FAC_NAME[s.fac]) + ' · '}${s.tier || LAYER_NAME[r.layer]}${r.note ? ' · ' + esc(r.note) : ''}${r.overlap ? ' · data overlaps ' + esc(byId[r.overlap].short) : ''}${extra}</span></span>
      <span class="bd">${fmtBand(r.lo, r.hi)}</span></button></li>`;
  }
  function renderPanel() {
    if (st.view3d) return panel3d();
    if (st.mode === 'explore') {
      if (!st.marker) {
        panel.innerHTML = `<p class="eyebrow">Explore</p>
          <p class="hint">Tap anywhere on the map to see every sector and approach control that owns airspace there, with its altitudes. Pinch or scroll to zoom; drag to pan. Use the layer chips to show low, high, approach, or any mix, and Neighbors to add the ZNY, ZAU and Toronto sectors along ZOB's edges (ZDC, ZID and ZBW appear as outlines only).</p>${srcLine}`;
        return;
      }
      const res = st.results;
      panel.innerHTML = `<p class="eyebrow">Owners at <span class="coord">${fmtLat(st.marker[0])} ${fmtLon(st.marker[1])}</span></p>
        ${res.length ? `<ul class="stack">${res.map(r => ownRow(r)).join('')}</ul>`
          : `<p class="hint">No ZOB sector in the visible layers owns this point.</p>`}
        <p class="hint" style="margin-top:8px;font-size:12px">Tap a row to focus that sector.</p>${srcLine}`;
      panel.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => {
        st.focus = b.dataset.focus; focusSel.value = st.focus; fit(sectorBounds(byId[st.focus]));
      });
      return;
    }
    const c = st.ch;
    const sc = `<span class="score">${st.score.right}/${st.score.total} correct</span>`;
    if (!c) {
      panel.innerHTML = `<p class="eyebrow">Challenge</p><p class="hint">Couldn't find a point for these settings. Turn on another layer or clear the focus.</p>`;
      return;
    }
    const R = RADII[st.radiusIdx];
    const keepIds = new Set(c.answer.map(a => a.sid).concat(c.rows.map(r => r.sid).filter(Boolean)));
    const nearVols = volumes.filter(v => v.layer !== 'outline' && st.layers.has(v.layer) && (v.home || st.nb)
      && (R === Infinity || keepIds.has(v.sid) || distNm(v, c.lat, c.lon) <= R));
    const poolIds = new Set(nearVols.map(v => v.sid));
    const pool = sectors.filter(s => poolIds.has(s.id));
    const visSectors = pool.slice().sort((a, b) => (b.home - a.home) || a.fac.localeCompare(b.fac) || (a.approach - b.approach) || (a.approach ? a.name.localeCompare(b.name) : a.id.localeCompare(b.id)));
    const optLabel = s => {
      if (s.approach) return esc(s.name.replace(/ (TRACON|RAPCON|Approach)$/, '') + ' ' + s.short);
      const n = numOf(s.id);
      return esc(st.split && n ? s.name.replace(new RegExp('\\s0*' + (+n) + '(?=\\s|$)'), '').trim() : s.name);
    };
    if (st.split) visSectors.sort((a, b) => (b.home - a.home) || a.fac.localeCompare(b.fac) || (a.approach - b.approach) || optLabel(a).localeCompare(optLabel(b)));
    const numList = [...new Set(pool.map(s => numOf(s.id)).filter(Boolean))].sort();
    const numOpts = sel => `<option value="">#</option>` + numList.map(n => `<option value="${n}"${n === sel ? ' selected' : ''}>${n}</option>`).join('');
    const sectorOpts = sel => ['ZOB', 'ZNY', 'ZAU', 'CZYZ'].map(f => {
      const l = visSectors.filter(s => s.fac === f);
      return l.length ? `<optgroup label="${f}">${l.map(s => `<option value="${s.id}"${s.id === sel ? ' selected' : ''}>${optLabel(s)}</option>`).join('')}</optgroup>` : '';
    }).join('');
    // strata those sectors use, plus the "next altitude" values that appear where approaches and shelves cut them
    const altSet = new Set([0]);
    nearVols.forEach(v => {
      altSet.add(v.floor); altSet.add(v.ceil);
      if (v.layer === 'approach' || v.prio >= 1) { altSet.add(v.ceil + 10); if (v.floor > 0) altSet.add(v.floor - 10); }
    });
    c.answer.forEach(a => { altSet.add(a.lo); altSet.add(a.hi); });
    const altList = [...altSet].filter(a => a >= 0 && a <= D.unl && !(a > 600 && a < D.unl)).sort((x, y) => x - y);
    const nZob = pool.length;
    const altOpts = sel => `<option value="">—</option>` + altList.map(a => `<option value="${a}"${String(sel) === String(a) ? ' selected' : ''}>${fmtAlt(a)}</option>`).join('');
    const want = new Set(c.answer.map(key));
    const rowsHtml = c.rows.map((r, i) => {
      const k = key({ sid: r.sid, lo: +r.lo, hi: +r.hi });
      // Grade each part: green = right; on a wrong row, amber = this part matches the closest
      // correct band for that sector, red = this part is the mistake (or the sector isn't an owner).
      let g = { sid: '', num: '', lo: '', hi: '' };
      if (c.checked && r.sid) {
        const cands = c.answer.filter(a => a.sid === r.sid);
        const numOk = (r.num || '') === numOf(r.sid);
        if (!cands.length) g = { sid: 'no', num: 'no', lo: 'no', hi: 'no' };
        else {
          const best = cands.map(a => ({ a, n: (String(a.lo) === String(r.lo)) + (String(a.hi) === String(r.hi)) })).sort((x, y) => y.n - x.n)[0];
          const allOk = best.n === 2 && (!st.split || numOk);
          const part = ok => allOk ? 'ok' : ok ? 'amb' : 'no';
          g = { sid: part(true), num: part(numOk), lo: part(String(best.a.lo) === String(r.lo)), hi: part(String(best.a.hi) === String(r.hi)) };
        }
      }
      const cls = '';
      const noNum = r.sid && !numOf(r.sid);
      return `<div class="row ${st.split ? 'split' : ''}" data-i="${i}">
         <select data-f="sid" class="${g.sid}" id="ch-sid-${i}" aria-label="Sector ${i + 1}"${c.checked ? ' disabled' : ''}><option value="">Sector…</option>${sectorOpts(r.sid)}</select>
        ${st.split ? `<select data-f="num" class="${g.num}" id="ch-num-${i}" aria-label="Sector number ${i + 1}"${c.checked || noNum ? ' disabled' : ''}>${noNum ? '<option value="">n/a</option>' : numOpts(r.num || '')}</select>` : ''}
        <select data-f="lo" class="${g.lo}" id="ch-lo-${i}" aria-label="Floor ${i + 1}"${c.checked ? ' disabled' : ''}>${altOpts(r.lo)}</select>
        <select data-f="hi" class="${g.hi}" id="ch-hi-${i}" aria-label="Ceiling ${i + 1}"${c.checked ? ' disabled' : ''}>${altOpts(r.hi)}</select>
        <button class="x" data-rm="${i}" aria-label="Remove row"${c.checked || c.rows.length === 1 ? ' disabled' : ''}>×</button>
      </div>`;
    }).join('');
    let result = '';
    if (c.checked) {
      const got = new Set(c.rows.filter(r => r.sid).map(rowKey));
      result = `<p class="verdict ${c.right ? 'good' : 'bad'}">${c.right ? 'Correct' : 'Not quite'}</p>
        <ul class="stack">${c.answer.map(a => ownRow(a, got.has(key(a)) ? ' · <span class="tag good">got it</span>' : ' · <span class="tag bad">missed</span>')).join('')}</ul>`;
    }
    panel.innerHTML = `<p class="eyebrow">Challenge · <span class="coord">${fmtLat(c.lat)} ${fmtLon(c.lon)}</span></p>
      <p class="hint" style="margin-bottom:10px">Name every ${[...st.layers].map(l => LAYER_NAME[l].toLowerCase()).join(' / ')} owner over the marker${st.focus ? ` (${c.outside ? 'just outside' : 'inside'} ${esc(byId[st.focus].display)})` : ''}, each with its floor and ceiling. A sector cut by an approach shelf gets one row per band.</p>
      ${st.focus ? `<div class="seg" role="group" aria-label="Where points land">
        <span>Points</span>
        ${RINGS.map((r, i) => `<button data-ring="${i}" aria-pressed="${st.ringIdx === i}">${r ? 'Inside + ' + r + ' nm' : 'Inside only'}</button>`).join('')}
      </div>` : ''}
      <div class="slider">
        <label for="ch-radius">Choices</label>
        <input type="range" id="ch-radius" min="0" max="${RADII.length - 1}" step="1" value="${st.radiusIdx}" aria-describedby="ch-radius-val">
        <span id="ch-radius-val">${R === Infinity ? 'everything' : 'within ' + R + ' nm'} · ${nZob} sectors · ${altList.length} altitudes</span>
      </div>
      <div class="seg" role="group" aria-label="Sector numbers">
        <span>Numbers</span>
        <button data-split aria-pressed="${st.split}">Pick separately</button>
      </div>
      <div class="labels ${st.split ? 'split' : ''}"><span>Sector</span>${st.split ? '<span>No.</span>' : ''}<span>Floor</span><span>Ceiling</span><span></span></div>
      <div class="stack">${rowsHtml}</div>
      <div class="actions">
        ${c.checked ? `<button class="btn primary" id="ch-next">Next point</button>`
          : `<button class="btn" id="ch-add">+ Add owner</button><button class="btn primary" id="ch-check">Check</button><button class="btn" id="ch-skip">Skip</button>`}
        ${sc}
      </div>${result}`;
    panel.querySelectorAll('.row select').forEach(s => s.onchange = () => {
      const i = +s.closest('.row').dataset.i; c.rows[i][s.dataset.f] = s.value;
      if (st.split && s.dataset.f === 'sid') { if (!numOf(s.value)) c.rows[i].num = ''; renderPanel(); }
    });
    const sp = panel.querySelector('[data-split]');
    if (sp) sp.onclick = () => {
      st.split = !st.split;
      try { localStorage.setItem('zob-split', st.split ? '1' : ''); } catch (e) {}
      renderPanel();
    };
    panel.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { c.rows.splice(+b.dataset.rm, 1); renderPanel(); });
    panel.querySelectorAll('[data-ring]').forEach(b => b.onclick = () => {
      st.ringIdx = +b.dataset.ring;
      try { localStorage.setItem('zob-ring', String(st.ringIdx)); } catch (e) {}
      newChallenge();
    });
    const rad = document.getElementById('ch-radius');
    if (rad) rad.oninput = () => {
      st.radiusIdx = +rad.value;
      try { localStorage.setItem('zob-radius', String(st.radiusIdx)); } catch (e) {}
      renderPanel();
      const again = document.getElementById('ch-radius'); if (again) again.focus();
    };
    panel.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => {});
    const q = id => document.getElementById(id);
    if (q('ch-add')) q('ch-add').onclick = () => { c.rows.push({ sid: '', lo: '', hi: '' }); renderPanel(); };
    if (q('ch-check')) q('ch-check').onclick = check;
    if (q('ch-skip')) q('ch-skip').onclick = newChallenge;
    if (q('ch-next')) q('ch-next').onclick = newChallenge;
  }
  renderPanel();
  // expose for a quick self-test
  window.__zob = { lookup, sectors };
})();
</script>

</body>
</html>
